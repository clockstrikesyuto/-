<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="theme-color" content="#111318" />
<title>BEAT RITUAL — tactile rhythm game</title>
<link rel="stylesheet" href="beat.css" />
</head>
<body>
<div id="app">
  <section id="home" class="screen active">
    <div class="brand">
      <div><small>TACTILE RHYTHM</small><h1>BEAT<br>RITUAL</h1></div>
      <div class="badge">🎧 音あり推奨</div>
    </div>
    <p class="intro">日常の「気持ちいい音」を、指先で鳴らす。右から流れてくるリングが白いラインに重なった瞬間、画面をタップ。ステージごとに道具も音も景色も変わります。</p>
    <div class="stage-grid" id="stageGrid"></div>
    <div class="actions">
      <button class="primary" id="allBtn">▶ ALL STAGES</button>
      <button class="ghost" id="howBtn">遊び方</button>
    </div>
  </section>
  <section id="game" class="screen">
    <div class="game-bg" id="gameBg"></div><div class="grain"></div><div class="fever" id="fever"></div>
    <canvas id="canvas"></canvas>
    <div class="hud">
      <div class="hud-left"><button class="back" id="backBtn">×</button><div class="stage-title"><b id="hudTitle">LIGHTER</b><span id="hudSub">CLICK / IGNITE</span></div></div>
      <div class="combo"><strong id="combo">0</strong><span>COMBO</span></div>
      <div class="score"><strong id="score">000000</strong><span>SCORE</span></div>
    </div>
    <div class="progress"><i id="progressBar"></i></div>
    <div class="judgement" id="judgement">PERFECT</div>
    <div class="item-wrap"><div class="item" id="item">🔥</div></div>
    <div class="instruction" id="instruction">TAP / SPACE — ラインに重なった瞬間</div>
    <div id="countdown"></div>
  </section>
  <section id="results" class="screen">
    <div class="result-card">
      <div class="result-top"><div class="rank" id="rank">S</div><div class="result-score"><strong id="finalScore">124,500</strong><span>FINAL SCORE</span></div></div>
      <div class="best" id="bestText"></div><div class="unlock" id="unlockText"></div>
      <div class="stats">
        <div class="stat"><b id="stPerfect">0</b><span>PERFECT</span></div>
        <div class="stat"><b id="stGreat">0</b><span>GREAT</span></div>
        <div class="stat"><b id="stGood">0</b><span>GOOD</span></div>
        <div class="stat"><b id="stMiss">0</b><span>MISS</span></div>
      </div>
      <div class="result-actions"><button class="primary" id="retryBtn">↻ RETRY</button><button class="ghost" id="nextBtn">NEXT STAGE →</button><button class="ghost" id="homeBtn">STAGE SELECT</button></div>
    </div>
  </section>
</div>
<script src="beat.js"></script>
</body>
</html>
