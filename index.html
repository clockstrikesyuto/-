<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#ffcc3d" />
<title>POKO SMASH!</title>
<style>
:root{--ink:#1d2230;--paper:#fffdf6;--yellow:#ffd84b;--orange:#ff8b3d;--pink:#ff5d8f;--blue:#40bde8;--green:#62d66f;--purple:#8d75ef;--shadow:0 10px 0 rgba(40,31,21,.16);--soft:0 16px 42px rgba(45,34,18,.14)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:ui-rounded,"Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;color:var(--ink);background:#fff5c8;overscroll-behavior:none}
body{min-height:100dvh;background:radial-gradient(circle at 15% 8%,#fff 0 2%,transparent 3%),radial-gradient(circle at 82% 15%,#fff 0 1.8%,transparent 2.8%),linear-gradient(160deg,#fff8c9 0,#ffe17a 45%,#ffc758 100%);overflow-x:hidden}
button,input{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.app{width:min(100%,900px);margin:0 auto;min-height:100dvh;padding:18px clamp(14px,3vw,26px) 28px;position:relative}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.mini-logo{font-weight:1000;letter-spacing:.04em;font-size:15px;background:#fff;border:3px solid var(--ink);border-radius:999px;padding:8px 13px;box-shadow:0 4px 0 var(--ink)}
.icon-btn{border:3px solid var(--ink);background:#fff;border-radius:50%;width:44px;height:44px;font-size:21px;box-shadow:0 4px 0 var(--ink);display:grid;place-items:center}
.panel{background:rgba(255,255,255,.94);border:4px solid var(--ink);border-radius:28px;padding:clamp(18px,4vw,34px);box-shadow:var(--shadow),var(--soft)}
.hero{text-align:center;padding-top:28px}.title{font-size:clamp(45px,11vw,88px);line-height:.88;margin:0;font-weight:1000;letter-spacing:-.07em;color:#ff633f;text-shadow:0 5px 0 #fff,0 9px 0 var(--ink);transform:rotate(-2deg)}.title span{color:#46bfe8}.tagline{font-weight:900;font-size:clamp(17px,4vw,24px);margin:27px 0 6px}.sub{font-weight:700;color:#646878;margin:0 auto 22px;line-height:1.65;max-width:560px}
.mascots{display:flex;justify-content:center;align-items:flex-end;gap:8px;height:115px;margin:12px 0 18px}.mascot{position:relative;width:82px;height:82px;border:4px solid var(--ink);border-radius:48% 48% 43% 43%;background:var(--blue);box-shadow:inset 0 -10px rgba(0,0,0,.08),0 7px 0 rgba(29,34,48,.2);animation:bob 1.2s ease-in-out infinite alternate}.mascot:nth-child(2){background:var(--pink);height:94px;width:94px;animation-delay:-.5s}.mascot:nth-child(3){background:var(--green);animation-delay:-.9s}.mascot:before,.mascot:after{content:"";position:absolute;top:-15px;width:24px;height:27px;background:inherit;border:4px solid var(--ink);border-bottom:0;border-radius:60% 60% 0 0}.mascot:before{left:10px;transform:rotate(-13deg)}.mascot:after{right:10px;transform:rotate(13deg)}.face{position:absolute;inset:22px 13px auto;display:flex;justify-content:center;gap:17px}.eye{width:10px;height:13px;background:var(--ink);border-radius:50%}.mouth{position:absolute;left:50%;top:53px;width:20px;height:9px;border-bottom:4px solid var(--ink);border-radius:50%;transform:translateX(-50%)}@keyframes bob{to{transform:translateY(-8px) rotate(2deg)}}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:620px;margin:0 auto}.btn{appearance:none;border:4px solid var(--ink);border-radius:17px;padding:15px 18px;font-weight:1000;font-size:18px;color:var(--ink);box-shadow:0 6px 0 var(--ink);transition:.08s transform,.08s box-shadow}.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}.btn.primary{background:var(--orange);color:#fff}.btn.secondary{background:#fff}.btn.green{background:var(--green)}.btn.pink{background:var(--pink);color:#fff}.btn:disabled{opacity:.45;filter:grayscale(.3);cursor:not-allowed}
.screen-title{font-size:clamp(28px,6vw,42px);font-weight:1000;margin:2px 0 6px}.screen-sub{margin:0 0 22px;font-weight:750;color:#737684}.form{display:grid;gap:15px}.field label{display:block;font-weight:900;margin:0 0 7px}.field input{width:100%;border:4px solid var(--ink);border-radius:16px;padding:15px 16px;background:#fff;font-size:19px;font-weight:900;outline:none}.field input:focus{box-shadow:0 0 0 5px rgba(64,189,232,.28)}.back{border:0;background:transparent;font-weight:900;padding:9px 2px;margin-top:15px;color:#5c6070}
.lobby-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.code-label{font-size:12px;font-weight:900;color:#777b88}.room-code{font-size:clamp(40px,10vw,68px);line-height:1;font-weight:1000;letter-spacing:.12em;margin:3px 0 0;color:#ff643f}.status-pill{border:3px solid var(--ink);border-radius:999px;padding:7px 11px;background:#fff4a9;font-weight:1000;font-size:12px;white-space:nowrap}.lobby-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(210px,.7fr);gap:18px;margin-top:22px}.players{display:grid;grid-template-columns:1fr 1fr;gap:10px}.player-card{border:3px solid var(--ink);border-radius:17px;background:#fff;padding:13px;min-height:78px;display:flex;align-items:center;gap:10px;position:relative;overflow:hidden}.player-card.empty{border-style:dashed;opacity:.38}.avatar{width:43px;height:43px;flex:0 0 43px;border:3px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-weight:1000;background:#9ce6ff}.player-card:nth-child(2) .avatar{background:#ffc3d5}.player-card:nth-child(3) .avatar{background:#baf0a7}.player-card:nth-child(4) .avatar{background:#d4c8ff}.pname{font-weight:1000;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.host-badge{font-size:11px;font-weight:1000;color:#8e611a}.online{position:absolute;right:9px;top:9px;width:9px;height:9px;border-radius:50%;background:#54d96f;border:2px solid var(--ink)}.online.off{background:#aaa}.qr-card{text-align:center;background:#fff8d9;border:3px solid var(--ink);border-radius:20px;padding:13px}.qr-card img{width:min(100%,180px);aspect-ratio:1;background:#fff;border:2px solid var(--ink);border-radius:10px;padding:6px}.qr-title{font-weight:1000;margin-bottom:8px}.copy-link{margin-top:8px;border:0;background:transparent;font-weight:900;text-decoration:underline}.mode-note{margin:18px 0 0;padding:13px 14px;border-radius:15px;background:#eff8ff;border:3px solid #8ed8f4;font-weight:850;line-height:1.55}.lobby-bottom{margin-top:18px}.hint{text-align:center;font-size:13px;font-weight:800;color:#717584;margin-top:10px}
.bracket-preview{margin-top:16px;border:3px solid var(--ink);border-radius:18px;background:#fff;padding:13px}.bracket-title{font-weight:1000;margin-bottom:9px}.bracket-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:7px 0}.bracket-name{background:#f4f5f8;border-radius:10px;padding:9px;font-weight:900;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.vs{font-size:12px;font-weight:1000;color:#858994}
#gameScreen{padding-bottom:10px}.game-shell{max-width:620px;margin:0 auto}.game-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:9px}.match-label{font-size:13px;font-weight:1000;background:#fff;border:3px solid var(--ink);border-radius:999px;padding:7px 10px;justify-self:start}.timer{font-size:clamp(32px,8vw,50px);font-weight:1000;line-height:1;color:#ff5f3f;text-shadow:0 3px #fff}.my-score{text-align:right;font-weight:1000;font-size:14px}.my-score strong{display:block;font-size:29px;color:#1e9fc8}.timebar{height:13px;border:3px solid var(--ink);background:#fff;border-radius:999px;overflow:hidden;margin:10px 0}.timebar>i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#55d86c,#ffd74a,#ff6345);transform-origin:left}
.versus-card{background:#fff;border:3px solid var(--ink);border-radius:15px;padding:9px 12px;display:flex;align-items:center;justify-content:center;gap:12px;font-weight:1000;margin-bottom:10px}.versus-card .score-num{font-size:24px;color:#ff633f;min-width:36px;text-align:center}.versus-card .me{color:#179eca}.combo{height:34px;text-align:center;font-size:21px;font-weight:1000;color:#ff5d8f;text-shadow:0 2px #fff;transition:.1s transform}.combo.bump{transform:scale(1.2)}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(8px,2vw,13px);background:linear-gradient(#78d84d,#43b948);border:4px solid var(--ink);border-radius:26px;padding:clamp(10px,2.5vw,18px);box-shadow:0 9px 0 #267d31,inset 0 0 0 5px rgba(255,255,255,.16);touch-action:manipulation;user-select:none;position:relative}.hole{aspect-ratio:1/.82;position:relative;overflow:hidden;border-radius:50% 50% 42% 42%;background:radial-gradient(ellipse at 50% 61%,#1f1110 0 37%,#63321d 38% 50%,#a35a2c 51% 63%,transparent 64%);isolation:isolate}.hole:after{content:"";position:absolute;left:4%;right:4%;bottom:9%;height:31%;border-radius:50%;background:#281311;z-index:5;pointer-events:none;box-shadow:0 -4px 0 #78411f}.target{position:absolute;z-index:3;width:72%;height:72%;left:14%;bottom:15%;transform:translateY(110%) scale(.8);transition:transform .09s cubic-bezier(.2,.9,.3,1.3);border:3px solid var(--ink);border-radius:48% 48% 42% 42%;background:#3fc0e8;box-shadow:inset 0 -8px rgba(0,0,0,.1);touch-action:none}.target.active{transform:translateY(0) scale(1)}.target:before,.target:after{content:"";position:absolute;top:-10%;width:26%;height:27%;background:inherit;border:3px solid var(--ink);border-bottom:0;border-radius:60% 60% 0 0;z-index:-1}.target:before{left:9%;transform:rotate(-12deg)}.target:after{right:9%;transform:rotate(12deg)}.target .eyes{position:absolute;top:28%;left:18%;right:18%;display:flex;justify-content:space-around}.target .eyes i{display:block;width:12%;aspect-ratio:.7;background:var(--ink);border-radius:50%}.target .mouth2{position:absolute;width:27%;height:13%;left:36%;top:57%;border-bottom:3px solid var(--ink);border-radius:50%}.target.skin1{background:#ff769d}.target.skin2{background:#74df78}.target.skin3{background:#9e8bf2}.target.gold{background:#ffd93d;box-shadow:inset 0 -8px #efa626,0 0 15px #fff078}.target.gold:after{content:"★";display:grid;place-items:center;top:48%;right:31%;width:auto;height:auto;border:0;background:none;font-size:20px;color:#fff;text-shadow:0 2px #a76c00;z-index:2}.target.decoy{background:#ee5e57}.target.decoy .mouth2{border-bottom:0;border-top:4px solid var(--ink);top:67%}.target.decoy .eyes i{transform:rotate(25deg);border-radius:0;height:4px;width:20%}.target.bomb{border-radius:50%;background:#353945;box-shadow:inset -7px -8px #16181e}.target.bomb:before{left:58%;top:-18%;width:14%;height:27%;border:0;border-radius:8px;background:#79542c;transform:rotate(24deg)}.target.bomb:after{content:"✦";left:auto;right:4%;top:-28%;width:auto;height:auto;border:0;background:none;color:#ffb52b;font-size:21px;z-index:4}.target.hit{transform:translateY(25%) scale(.65)!important;filter:brightness(1.5)}
.float{position:fixed;z-index:50;font-size:24px;font-weight:1000;pointer-events:none;animation:floatUp .55s ease-out forwards;text-shadow:0 2px #fff}@keyframes floatUp{to{transform:translateY(-52px) scale(1.2);opacity:0}}.board.danger{animation:danger .5s infinite alternate}@keyframes danger{to{box-shadow:0 9px 0 #267d31,0 0 0 7px rgba(255,74,55,.35)}}
.countdown-overlay,.spectator-overlay{position:absolute;inset:0;z-index:20;border-radius:22px;display:grid;place-items:center;text-align:center;background:rgba(255,248,202,.82);backdrop-filter:blur(2px);font-weight:1000}.countdown-overlay strong{font-size:clamp(70px,22vw,145px);color:#ff5e3f;text-shadow:0 6px #fff,0 10px var(--ink)}.spectator-overlay{padding:25px}.spectator-overlay h3{font-size:28px;margin:0 0 8px}.spectator-overlay p{font-weight:800;line-height:1.55}.watch-score{font-size:22px;margin-top:13px}.watch-score b{font-size:34px;color:#ff613f}.legend{display:flex;justify-content:center;flex-wrap:wrap;gap:7px;margin-top:11px;font-weight:900;font-size:12px}.legend span{border:2px solid var(--ink);border-radius:999px;padding:5px 8px;background:#fff}.legend .lgold{background:#fff3a7}.legend .lbad{background:#ffd1cd}
.result-wrap{text-align:center}.result-kicker{font-weight:1000;color:#f2553d;letter-spacing:.13em}.result-title{font-size:clamp(35px,9vw,65px);font-weight:1000;margin:5px 0 12px;line-height:1}.winner-card{border:4px solid var(--ink);border-radius:23px;background:linear-gradient(145deg,#fff7ad,#ffd349);padding:22px;margin:14px auto;max-width:480px;box-shadow:0 7px 0 var(--ink);position:relative}.crown{font-size:48px;display:block}.winner-name{font-size:clamp(29px,7vw,45px);font-weight:1000}.winner-score{font-size:17px;font-weight:900}.result-list{display:grid;gap:9px;margin:18px auto;max-width:520px}.result-row{border:3px solid var(--ink);border-radius:14px;background:#fff;padding:10px 13px;display:flex;justify-content:space-between;align-items:center;font-weight:1000}.result-row.win{background:#fff5aa}.result-row small{display:block;font-weight:700;color:#727684}.bracket-final{display:grid;gap:10px;margin:18px 0}.match-box{border:3px solid var(--ink);background:#fff;border-radius:16px;padding:12px}.match-box .m-label{font-size:12px;font-weight:1000;color:#797d89;margin-bottom:7px}.match-box .m-line{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}.m-player{padding:8px;border-radius:10px;background:#f1f2f5;font-weight:1000}.m-player.winner{background:#fff1a1;box-shadow:inset 0 0 0 3px #ffca2f}
.toast{position:fixed;z-index:100;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;background:#202533;color:#fff;font-weight:900;border-radius:999px;padding:11px 16px;pointer-events:none;transition:.2s;max-width:calc(100% - 32px);text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}
.confetti{position:fixed;z-index:90;top:-20px;width:11px;height:18px;border-radius:2px;animation:fall var(--dur) linear forwards;pointer-events:none}@keyframes fall{to{transform:translate(var(--drift),110vh) rotate(780deg)}}
@media(max-width:650px){.app{padding-top:10px}.topbar{margin-bottom:9px}.panel{border-width:3px;border-radius:23px}.actions{grid-template-columns:1fr}.lobby-grid{grid-template-columns:1fr}.qr-card{display:grid;grid-template-columns:110px 1fr;gap:12px;text-align:left;align-items:center}.qr-card img{width:110px}.players{grid-template-columns:1fr 1fr}.board{gap:7px;padding:9px;border-radius:20px}.game-top{grid-template-columns:1fr auto 1fr}.target{border-width:2px}.target:before,.target:after{border-width:2px}.hole:after{bottom:7%}}
@media(max-width:390px){.players{grid-template-columns:1fr}.player-card{min-height:62px}.qr-card{grid-template-columns:95px 1fr}.qr-card img{width:95px}.mini-logo{font-size:12px}.game-top{gap:4px}.match-label{font-size:10px;padding:6px}.my-score{font-size:11px}.my-score strong{font-size:23px}.board{gap:5px}.legend{font-size:10px}}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="mini-logo">⚡ POKO SMASH!</div>
    <button id="soundBtn" class="icon-btn" type="button" aria-label="サウンド">🔊</button>
  </div>

  <section id="homeScreen" class="panel hero">
    <h1 class="title">POKO<br><span>SMASH!</span></h1>
    <p class="tagline">ひょこっと出たら、即タップ！</p>
    <p class="sub">2〜4人で同時対戦。4人そろったら準決勝→決勝のトーナメント！説明ほぼゼロで、そのまま遊べる30秒バトル。</p>
    <div class="mascots" aria-hidden="true">
      <div class="mascot"><div class="face"><i class="eye"></i><i class="eye"></i></div><i class="mouth"></i></div>
      <div class="mascot"><div class="face"><i class="eye"></i><i class="eye"></i></div><i class="mouth"></i></div>
      <div class="mascot"><div class="face"><i class="eye"></i><i class="eye"></i></div><i class="mouth"></i></div>
    </div>
    <div class="actions">
      <button class="btn primary" id="goCreate">部屋をつくる</button>
      <button class="btn secondary" id="goJoin">コードで参加</button>
    </div>
  </section>

  <section id="createScreen" class="panel hidden">
    <h2 class="screen-title">部屋をつくる</h2>
    <p class="screen-sub">あなたもプレイヤーとして参加します。</p>
    <div class="form">
      <div class="field"><label for="createName">なまえ</label><input id="createName" maxlength="14" placeholder="ゆうと" autocomplete="nickname"></div>
      <button class="btn primary" id="createBtn">ロビーを作成！</button>
    </div>
    <button class="back" data-back>← もどる</button>
  </section>

  <section id="joinScreen" class="panel hidden">
    <h2 class="screen-title">ゲームに参加</h2>
    <p class="screen-sub">4桁コードと名前を入れてね。</p>
    <div class="form">
      <div class="field"><label for="joinCode">ルームコード</label><input id="joinCode" inputmode="numeric" maxlength="4" placeholder="1234" autocomplete="off"></div>
      <div class="field"><label for="joinName">なまえ</label><input id="joinName" maxlength="14" placeholder="あやか" autocomplete="nickname"></div>
      <button class="btn green" id="joinBtn">参加する！</button>
    </div>
    <button class="back" data-back>← もどる</button>
  </section>

  <section id="lobbyScreen" class="panel hidden">
    <div class="lobby-head"><div><div class="code-label">ROOM CODE</div><div id="roomCode" class="room-code">----</div></div><div id="lobbyStatus" class="status-pill">待機中</div></div>
    <div class="lobby-grid">
      <div>
        <div id="playerCards" class="players"></div>
        <div id="modeNote" class="mode-note"></div>
        <div id="bracketPreview" class="bracket-preview hidden"></div>
      </div>
      <div class="qr-card">
        <img id="qrImage" alt="参加用QRコード" />
        <div><div class="qr-title">スマホで参加 📱</div><div style="font-size:12px;font-weight:750;line-height:1.45;color:#696d79">QRを読み取ると、この部屋の参加画面が開きます。</div><button id="copyLink" class="copy-link">参加URLをコピー</button></div>
      </div>
    </div>
    <div class="lobby-bottom"><button id="startBtn" class="btn primary" style="width:100%" disabled>2人以上でスタート</button><div id="hostHint" class="hint"></div></div>
  </section>

  <section id="gameScreen" class="hidden">
    <div class="game-shell">
      <div class="game-top"><div id="matchLabel" class="match-label">BATTLE</div><div id="timer" class="timer">30.0</div><div class="my-score">SCORE<strong id="myScore">0</strong></div></div>
      <div class="timebar"><i id="timeFill"></i></div>
      <div id="versusCard" class="versus-card"></div>
      <div id="combo" class="combo"></div>
      <div id="board" class="board">
        <div id="countdownOverlay" class="countdown-overlay hidden"><strong>3</strong></div>
        <div id="spectatorOverlay" class="spectator-overlay hidden"></div>
      </div>
      <div class="legend"><span>🙂 +1</span><span class="lgold">⭐ +3</span><span class="lbad">😡 −1</span><span class="lbad">💣 −2</span></div>
    </div>
  </section>

  <section id="resultScreen" class="panel hidden result-wrap"></section>
</div>
<div id="toast" class="toast"></div>
<script>
(() => {
  const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
  const screens=['homeScreen','createScreen','joinScreen','lobbyScreen','gameScreen','resultScreen'];
  const net={code:'',playerId:'',playerToken:'',hostToken:'',ws:null,state:null,retry:null};
  const game={active:false,matchId:'',seed:0,events:[],nextEvent:0,activeTargets:new Map(),startPerf:0,endPerf:0,score:0,hits:0,misses:0,combo:0,bestCombo:0,lastSent:0,raf:0,finishLock:false};
  let audioOn=localStorage.getItem('poko_sound')!=='off',audioCtx=null,lastStage='',lastResultKey='';

  function show(id){screens.forEach(x=>$('#'+x).classList.toggle('hidden',x!==id));}
  function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),1800)}
  function initials(name){return [...(name||'?')].slice(0,2).join('').toUpperCase()}
  function sessionKey(code){return `poko_session_${code}`}
  function saveSession(){if(!net.code)return;localStorage.setItem(sessionKey(net.code),JSON.stringify({playerId:net.playerId,playerToken:net.playerToken,hostToken:net.hostToken||''}))}
  function loadSession(code){try{return JSON.parse(localStorage.getItem(sessionKey(code))||'null')}catch{return null}}
  function headers(){const h={'content-type':'application/json'};if(net.hostToken)h['x-host-token']=net.hostToken;return h}
  async function api(url,opt={}){const r=await fetch(url,opt);let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.detail||'エラーが発生しました');return d}

  function ensureAudio(){if(!audioOn)return null;if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}
  function tone(f,d=.06,type='square',g=.03,delay=0){const a=ensureAudio();if(!a)return;const o=a.createOscillator(),v=a.createGain();o.type=type;o.frequency.value=f;v.gain.setValueAtTime(g,a.currentTime+delay);v.gain.exponentialRampToValueAtTime(.001,a.currentTime+delay+d);o.connect(v);v.connect(a.destination);o.start(a.currentTime+delay);o.stop(a.currentTime+delay+d+.02)}
  function sfx(k){if(k==='hit'){tone(560,.04);tone(760,.05,'square',.02,.035)}else if(k==='gold'){[650,850,1050].forEach((f,i)=>tone(f,.07,'square',.025,i*.045))}else if(k==='bad'){tone(150,.12,'sawtooth',.035)}else if(k==='count'){tone(330,.06)}else if(k==='go'){tone(660,.08);tone(990,.1,'square',.03,.07)}else if(k==='win'){[523,659,784,1047].forEach((f,i)=>tone(f,.14,'square',.035,i*.1))}}
  $('#soundBtn').textContent=audioOn?'🔊':'🔇';$('#soundBtn').onclick=()=>{audioOn=!audioOn;localStorage.setItem('poko_sound',audioOn?'on':'off');$('#soundBtn').textContent=audioOn?'🔊':'🔇';if(audioOn){ensureAudio();tone(700,.05)}};document.addEventListener('pointerdown',ensureAudio,{once:true});

  $('#goCreate').onclick=()=>show('createScreen');$('#goJoin').onclick=()=>show('joinScreen');$$('[data-back]').forEach(b=>b.onclick=()=>{history.replaceState({},'',location.origin+location.pathname.replace(/\/(host|join)\/\d{4}.*/,''));show('homeScreen')});
  $('#joinCode').addEventListener('input',e=>e.target.value=e.target.value.replace(/\D/g,'').slice(0,4));

  $('#createBtn').onclick=async()=>{try{const name=$('#createName').value.trim();if(!name)return toast('名前を入れてね');const d=await api('/api/rooms',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name})});Object.assign(net,{code:d.code,playerId:d.player_id,playerToken:d.player_token,hostToken:d.host_token});saveSession();history.replaceState({},'',`/host/${d.code}#id=${d.player_id}&player=${encodeURIComponent(d.player_token)}&host=${encodeURIComponent(d.host_token)}`);connect()}catch(e){toast(e.message)}};
  $('#joinBtn').onclick=async()=>{try{const code=$('#joinCode').value.trim(),name=$('#joinName').value.trim();if(!/^\d{4}$/.test(code)||!name)return toast('コードと名前を入れてね');const d=await api(`/api/rooms/${code}/join`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name})});Object.assign(net,{code,playerId:d.player_id,playerToken:d.player_token,hostToken:''});saveSession();history.replaceState({},'',`/join/${code}#id=${d.player_id}&player=${encodeURIComponent(d.player_token)}`);connect()}catch(e){toast(e.message)}};

  function connect(){if(net.ws)try{net.ws.close()}catch{};const proto=location.protocol==='https:'?'wss':'ws';const u=new URL(`${proto}://${location.host}/ws/${net.code}`);u.searchParams.set('player',net.playerId);u.searchParams.set('token',net.playerToken);if(net.hostToken)u.searchParams.set('host',net.hostToken);const ws=net.ws=new WebSocket(u);ws.onmessage=e=>{const s=JSON.parse(e.data);if(s.type==='state'){net.state=s;applyState(s)}};ws.onclose=()=>{if(net.ws!==ws)return;clearTimeout(net.retry);net.retry=setTimeout(connect,1200)};ws.onerror=()=>ws.close()}

  $('#startBtn').onclick=async()=>{try{await api(`/api/rooms/${net.code}/start`,{method:'POST',headers:headers()})}catch(e){toast(e.message)}};
  $('#copyLink').onclick=async()=>{const url=`${location.origin}/join/${net.code}`;try{await navigator.clipboard.writeText(url);toast('参加URLをコピーしたよ！')}catch{prompt('このURLをコピーしてね',url)}};

  function renderLobby(s){show('lobbyScreen');$('#roomCode').textContent=s.code;$('#lobbyStatus').textContent=`${s.players.length} / 4人`;
    $('#playerCards').innerHTML=[0,1,2,3].map(i=>{const p=s.players[i];if(!p)return `<div class="player-card empty"><div class="avatar">?</div><div><div class="pname">参加待ち</div></div></div>`;return `<div class="player-card"><div class="avatar">${esc(initials(p.name))}</div><div style="min-width:0"><div class="pname">${esc(p.name)}</div><div class="host-badge">${p.is_host?'👑 HOST':'PLAYER'}</div></div><i class="online ${p.connected?'':'off'}"></i></div>`}).join('');
    const n=s.players.length;$('#modeNote').innerHTML=n===4?'🏆 <b>4人トーナメント確定！</b><br>準決勝A・Bを同時開催 → 勝者2人でGRAND FINAL！':n===3?'⚡ <b>3人同時決勝</b><br>30秒で一番高いスコアを取った人が優勝！':n===2?'⚔️ <b>1対1 決勝</b><br>同じ出現パターンで30秒の真っ向勝負！':'👥 あと1人来ればスタートできます。4人そろうとトーナメントになります。';
    const bp=$('#bracketPreview');if(n===4){bp.classList.remove('hidden');bp.innerHTML=`<div class="bracket-title">🏆 TOURNAMENT</div><div class="bracket-row"><div class="bracket-name">${esc(s.players[0].name)}</div><div class="vs">VS</div><div class="bracket-name">${esc(s.players[1].name)}</div></div><div class="bracket-row"><div class="bracket-name">${esc(s.players[2].name)}</div><div class="vs">VS</div><div class="bracket-name">${esc(s.players[3].name)}</div></div><div style="text-align:center;font-size:12px;font-weight:900;margin-top:8px">▼ 勝者同士で GRAND FINAL ▼</div>`}else bp.classList.add('hidden');
    const joinUrl=`${location.origin}/join/${s.code}`;$('#qrImage').src=`https://api.qrserver.com/v1/create-qr-code/?size=240x240&margin=8&data=${encodeURIComponent(joinUrl)}`;
    const btn=$('#startBtn');btn.classList.toggle('hidden',!s.is_host);btn.disabled=n<2;btn.textContent=n<2?'2人以上でスタート':n===4?'トーナメント開始！🏆':'30秒バトル開始！';$('#hostHint').textContent=s.is_host?'あなたがホストです。全員そろったらスタート！':'ホストがスタートするまで待ってね。';
  }

  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
  function phase(t){if(t<10000)return{gap:720,life:650,min:1,max:2};if(t<20000)return{gap:520,life:480,min:2,max:3};if(t<25000)return{gap:380,life:350,min:2,max:4};return{gap:255,life:235,min:3,max:5}}
  function makeEvents(seed){const r=mulberry32(seed),events=[];let t=260,id=0;while(t<29750){const p=phase(t),count=p.min+Math.floor(r()*(p.max-p.min+1)),used=new Set();for(let j=0;j<count;j++){let h=Math.floor(r()*16),guard=0;while(used.has(h)&&guard++<25)h=Math.floor(r()*16);used.add(h);const roll=r();let type='normal',points=1;if(roll>.93){type='bomb';points=-2}else if(roll>.84){type='decoy';points=-1}else if(roll>.72){type='gold';points=3}events.push({id:id++,t,h,life:p.life,type,points,skin:Math.floor(r()*4)})}t+=p.gap*(.88+r()*.24)}return events}

  function buildBoard(){const b=$('#board');b.querySelectorAll('.hole').forEach(x=>x.remove());for(let i=0;i<16;i++){const h=document.createElement('div');h.className='hole';h.dataset.i=i;h.addEventListener('pointerdown',e=>{if(e.target.closest('.target'))return;if(!game.active)return;wrongTap(e.clientX,e.clientY)});b.appendChild(h)}}
  buildBoard();

  function startLocalGame(s){const m=s.my_match;if(!m){stopGame();showSpectator(s);return}const key=`${m.id}:${s.stage}`;show('gameScreen');$('#spectatorOverlay').classList.add('hidden');$('#matchLabel').textContent=m.label;renderVersus(s);if(game.matchId!==m.id){game.matchId=m.id;game.seed=m.seed;game.events=makeEvents(m.seed);game.nextEvent=0;game.activeTargets.clear();game.score=0;game.hits=0;game.misses=0;game.combo=0;game.bestCombo=0;game.finishLock=false;clearTargets();updateScoreUI()}
    if(s.stage==='countdown'){game.active=false;const cd=Math.max(0,s.countdown);game.endPerf=performance.now()+s.remaining*1000;game.startPerf=game.endPerf-s.game_seconds*1000;showCountdown(cd)}else if(s.stage==='playing'){hideCountdown();if(!game.active){game.active=true;const remain=Math.max(0,s.remaining);game.endPerf=performance.now()+remain*1000;game.startPerf=game.endPerf-s.game_seconds*1000;sfx('go');loop()}}
  }
  let cdTimer=null;function showCountdown(seconds){const o=$('#countdownOverlay');o.classList.remove('hidden');clearInterval(cdTimer);let until=performance.now()+seconds*1000,last=-1;const tick=()=>{const n=Math.max(1,Math.ceil((until-performance.now())/1000));o.querySelector('strong').textContent=n;if(n!==last){last=n;sfx('count')}};tick();cdTimer=setInterval(tick,70)}function hideCountdown(){clearInterval(cdTimer);$('#countdownOverlay').classList.add('hidden')}
  function clearTargets(){game.activeTargets.forEach(t=>{clearTimeout(t.timer);t.el.remove()});game.activeTargets.clear();$$('.target').forEach(e=>e.remove())}
  function loop(){cancelAnimationFrame(game.raf);const frame=()=>{if(!game.active)return;const now=performance.now(),elapsed=now-game.startPerf,remaining=Math.max(0,game.endPerf-now);$('#timer').textContent=(remaining/1000).toFixed(1);$('#timeFill').style.transform=`scaleX(${Math.max(0,remaining/(30000))})`;$('#board').classList.toggle('danger',remaining<5000);while(game.nextEvent<game.events.length&&game.events[game.nextEvent].t<=elapsed){const ev=game.events[game.nextEvent++];if(elapsed-ev.t<ev.life)spawn(ev,ev.life-(elapsed-ev.t))}if(remaining<=0){game.active=false;clearTargets();$('#timer').textContent='0.0';sendScore(true);return}game.raf=requestAnimationFrame(frame)};game.raf=requestAnimationFrame(frame)}

  function spawn(ev,life){const hole=$(`.hole[data-i="${ev.h}"]`);if(!hole)return;const old=game.activeTargets.get(ev.h);if(old){clearTimeout(old.timer);old.el.remove();game.activeTargets.delete(ev.h)}const el=document.createElement('div');el.className=`target ${ev.type==='normal'?`skin${ev.skin}`:ev.type}`;el.dataset.event=ev.id;el.innerHTML=`<div class="eyes"><i></i><i></i></div><i class="mouth2"></i>`;el.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();hitTarget(ev,el,e.clientX,e.clientY)},{once:true});hole.appendChild(el);requestAnimationFrame(()=>el.classList.add('active'));const timer=setTimeout(()=>{if(game.activeTargets.get(ev.h)?.el===el){game.activeTargets.delete(ev.h);el.classList.remove('active');setTimeout(()=>el.remove(),110)}},Math.max(70,life));game.activeTargets.set(ev.h,{el,timer})}
  function hitTarget(ev,el,x,y){if(!game.active||el.classList.contains('hit'))return;const cur=game.activeTargets.get(ev.h);if(!cur||cur.el!==el)return;clearTimeout(cur.timer);game.activeTargets.delete(ev.h);el.classList.add('hit');setTimeout(()=>el.remove(),100);game.hits++;game.score+=ev.points;if(ev.points>0){game.combo++;game.bestCombo=Math.max(game.bestCombo,game.combo);sfx(ev.type==='gold'?'gold':'hit')}else{game.combo=0;sfx('bad')}floatText(x,y,ev.points>0?`+${ev.points}`:`${ev.points}`,ev.points>0);updateScoreUI();sendScore()}
  function wrongTap(x,y){game.misses++;game.combo=0;sfx('bad');floatText(x,y,'MISS',false);updateScoreUI();sendScore()}
  function floatText(x,y,text,good){const f=document.createElement('div');f.className='float';f.textContent=text;f.style.left=`${x-18}px`;f.style.top=`${y-20}px`;f.style.color=good?'#ff5d8f':'#e2443d';document.body.appendChild(f);setTimeout(()=>f.remove(),600)}
  function updateScoreUI(){$('#myScore').textContent=game.score;const c=$('#combo');c.textContent=game.combo>=2?`${game.combo} COMBO!`:'';c.classList.remove('bump');void c.offsetWidth;if(game.combo>=2)c.classList.add('bump')}
  function sendScore(force=false){if(!net.ws||net.ws.readyState!==1)return;const now=performance.now();if(!force&&now-game.lastSent<70)return;game.lastSent=now;net.ws.send(JSON.stringify({type:'score',score:game.score,hits:game.hits,misses:game.misses,best_combo:game.bestCombo}))}
  function stopGame(){game.active=false;cancelAnimationFrame(game.raf);clearTargets();hideCountdown();$('#board').classList.remove('danger')}

  function renderVersus(s){const m=s.my_match;if(!m)return;const me=m.players.find(p=>p.id===s.player_id),others=m.players.filter(p=>p.id!==s.player_id);let text;if(others.length===1){const o=others[0];text=`<span class="me">${esc(me?.name||'YOU')}</span><span class="score-num">${me?.score??game.score}</span><span class="vs">VS</span><span class="score-num">${o.score}</span><span>${esc(o.name)}</span>`}else{text=m.players.map(p=>`<span class="${p.id===s.player_id?'me':''}">${esc(p.name)} <b class="score-num">${p.score}</b></span>`).join('<span class="vs">・</span>')}$('#versusCard').innerHTML=text}
  function showSpectator(s){show('gameScreen');$('#matchLabel').textContent='👀 WATCHING';$('#myScore').textContent='—';$('#combo').textContent='';$('#countdownOverlay').classList.add('hidden');const o=$('#spectatorOverlay');o.classList.remove('hidden');const m=s.matches[0];if(!m){o.innerHTML='<div><h3>対戦準備中…</h3></div>';return}const names=m.players.map(p=>`${esc(p.name)} <b>${p.score}</b>`).join(' <span class="vs">VS</span> ');o.innerHTML=`<div><h3>決勝を観戦中 👀</h3><p>準決勝で敗退したプレイヤーは<br>ここからリアルタイム観戦できます。</p><div class="watch-score">${names}</div></div>`;$('#versusCard').innerHTML=names;const rem=s.remaining||0;$('#timer').textContent=(rem/1000).toFixed? (rem/1000).toFixed(1):'--';$('#timeFill').style.transform=`scaleX(${Math.max(0,rem/30)})`}

  function playerById(s,id){return s.players.find(p=>p.id===id)}
  function renderRoundResult(s){stopGame();show('resultScreen');const box=$('#resultScreen');const winners=s.semi_winners.map(id=>playerById(s,id)).filter(Boolean);box.innerHTML=`<div class="result-kicker">SEMIFINAL COMPLETE</div><div class="result-title">決勝進出！🔥</div><div class="bracket-final">${s.matches.map(m=>{const win=s.semi_winners.find(id=>m.players.some(p=>p.id===id));return `<div class="match-box"><div class="m-label">${esc(m.label)}</div><div class="m-line">${m.players.map((p,i)=>`${i?'<div class="vs">VS</div>':''}<div class="m-player ${p.id===win?'winner':''}">${p.id===win?'👑 ':''}${esc(p.name)}<br><small>${p.score} pt</small></div>`).join('')}</div></div>`}).join('')}</div><div style="font-weight:1000;font-size:20px;margin:15px 0">${winners.map(p=>esc(p.name)).join(' VS ')}</div>${s.is_host?'<button id="nextBtn" class="btn pink" style="width:100%">GRAND FINAL スタート！</button>':'<div class="hint">ホストが決勝をスタートするまで待ってね</div>'}`;const nb=$('#nextBtn');if(nb)nb.onclick=async()=>{try{await api(`/api/rooms/${net.code}/next`,{method:'POST',headers:headers()})}catch(e){toast(e.message)}}}

  function renderFinal(s){stopGame();show('resultScreen');const champ=playerById(s,s.champion_id),box=$('#resultScreen');let rows=[];if(s.tournament){const finalists=s.matches[0]?.players||[];rows=finalists.map(p=>({...p})).sort((a,b)=>b.score-a.score)}else rows=[...s.players].sort((a,b)=>b.score-a.score);box.innerHTML=`<div class="result-kicker">BATTLE COMPLETE</div><div class="result-title">${s.tournament?'TOURNAMENT CHAMPION':'WINNER'} 🏆</div><div class="winner-card"><span class="crown">👑</span><div class="winner-name">${esc(champ?.name||'WINNER')}</div><div class="winner-score">${champ?.score??0} pt</div></div>${s.tournament?renderTournamentBracket(s):''}<div class="result-list">${rows.map((p,i)=>`<div class="result-row ${p.id===s.champion_id?'win':''}"><div>${p.id===s.champion_id?'🏆':'#'+(i+1)} ${esc(p.name)}<small>BEST COMBO ${p.best_combo} / MISS ${p.misses}</small></div><strong>${p.score} pt</strong></div>`).join('')}</div>${s.is_host?'<button id="rematchBtn" class="btn green" style="width:100%">もう一回！</button>':'<div class="hint">ホストが「もう一回！」を押すと再戦できます</div>'}`;const rb=$('#rematchBtn');if(rb)rb.onclick=async()=>{try{await api(`/api/rooms/${net.code}/rematch`,{method:'POST',headers:headers()})}catch(e){toast(e.message)}};const key=`${s.champion_id}:${s.matches[0]?.id}`;if(lastResultKey!==key){lastResultKey=key;sfx('win');confetti()}}
  function renderTournamentBracket(s){const f=s.matches[0];if(!f)return'';return `<div class="match-box"><div class="m-label">GRAND FINAL</div><div class="m-line">${f.players.map((p,i)=>`${i?'<div class="vs">VS</div>':''}<div class="m-player ${p.id===s.champion_id?'winner':''}">${p.id===s.champion_id?'👑 ':''}${esc(p.name)}<br><small>${p.score} pt</small></div>`).join('')}</div></div>`}
  function confetti(){const cols=['#ff5d8f','#40bde8','#62d66f','#ffd84b','#8d75ef','#ff8b3d'];for(let i=0;i<70;i++){const c=document.createElement('i');c.className='confetti';c.style.left=Math.random()*100+'vw';c.style.background=cols[i%cols.length];c.style.setProperty('--dur',(1.8+Math.random()*2)+'s');c.style.setProperty('--drift',(-90+Math.random()*180)+'px');c.style.animationDelay=(Math.random()*.5)+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),4500)}}

  function applyState(s){const stageChanged=lastStage!==s.stage;lastStage=s.stage;if(s.stage==='lobby')renderLobby(s);else if(s.stage==='countdown'||s.stage==='playing'){if(s.my_match)startLocalGame(s);else showSpectator(s);if(s.my_match)renderVersus(s)}else if(s.stage==='round_result')renderRoundResult(s);else if(s.stage==='final_result')renderFinal(s);if(stageChanged&&s.stage==='playing'&&!s.my_match)showSpectator(s)}

  function boot(){const m=location.pathname.match(/^\/(host|join)\/(\d{4})/);if(!m){show('homeScreen');return}const kind=m[1],code=m[2];$('#joinCode').value=code;const hash=new URLSearchParams(location.hash.slice(1)),stored=loadSession(code);const playerId=hash.get('id')||stored?.playerId||'',playerToken=hash.get('player')||stored?.playerToken||'',hostToken=kind==='host'?(hash.get('host')||stored?.hostToken||''):'';if(playerId&&playerToken){Object.assign(net,{code,playerId,playerToken,hostToken});saveSession();connect()}else{show('joinScreen')}}
  boot();
})();
</script>
</body>
