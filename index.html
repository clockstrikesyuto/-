<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<meta name="theme-color" content="#0b1020" />
<title>ROUTE RUSH</title>
<style>
:root{--bg:#080b14;--panel:#11182b;--panel2:#172038;--text:#f7f9ff;--muted:#9ba9c7;--line:#33415f;--cyan:#55e7ff;--pink:#ff5fa2;--yellow:#ffe36b;--green:#72f5a8;--danger:#ff667a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% -10%,#1a2c52 0,#0c1222 36%,#080b14 75%);color:var(--text);font-family:Inter,system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif}body{min-height:100vh;overflow-x:hidden}.app{width:min(100%,480px);margin:0 auto;min-height:100vh;padding:20px 16px 28px}.brand{padding:18px 0 8px;text-align:center}.logo{font-size:40px;font-weight:1000;letter-spacing:-2px;line-height:1}.logo span:first-child{color:var(--cyan);text-shadow:0 0 24px #55e7ff66}.logo span:last-child{color:var(--pink);text-shadow:0 0 24px #ff5fa266}.tag{margin-top:8px;color:var(--muted);font-weight:800}.card{background:linear-gradient(180deg,#151d33dd,#10172add);border:1px solid #ffffff14;border-radius:24px;padding:18px;box-shadow:0 18px 48px #0008,inset 0 1px #ffffff0d;backdrop-filter:blur(12px)}.stack{display:grid;gap:12px}.row{display:flex;gap:10px;align-items:center}.grow{flex:1}label{font-size:12px;color:var(--muted);font-weight:900;letter-spacing:.08em}.field{width:100%;border:1px solid #31405f;background:#0a1020;color:#fff;border-radius:15px;padding:14px 14px;font-size:16px;font-weight:800;outline:none}.field:focus{border-color:var(--cyan);box-shadow:0 0 0 3px #55e7ff20}.btn{appearance:none;border:0;border-radius:16px;padding:14px 16px;font-weight:1000;font-size:15px;cursor:pointer;color:#07101a;background:linear-gradient(135deg,var(--cyan),#a9f6ff);box-shadow:0 8px 20px #55e7ff28;transition:transform .08s ease,opacity .2s}.btn:active{transform:translateY(2px) scale(.99)}.btn.pink{background:linear-gradient(135deg,var(--pink),#ff9dca);box-shadow:0 8px 20px #ff5fa228}.btn.dark{color:#fff;background:#202b45;box-shadow:none;border:1px solid #ffffff16}.btn:disabled{opacity:.35;cursor:not-allowed}.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.seg button{border:1px solid #2f3b59;background:#0b1223;color:#a8b6d2;border-radius:14px;padding:12px;font-weight:1000}.seg button.active{color:#07101a;background:var(--yellow);border-color:transparent}.divider{display:flex;align-items:center;gap:10px;color:#657391;font-size:11px;font-weight:900;margin:2px 0}.divider:before,.divider:after{content:"";height:1px;background:#27334c;flex:1}.mini{font-size:12px;color:var(--muted);line-height:1.6}.room-code{text-align:center;font-size:44px;font-weight:1000;letter-spacing:.13em;color:var(--yellow);text-shadow:0 0 26px #ffe36b44;margin:5px 0 12px}.qr{display:block;width:164px;height:164px;margin:0 auto;border-radius:18px;background:#fff;padding:8px}.players{display:grid;gap:10px;margin:14px 0}.player{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:#0c1324;border:1px solid #ffffff0f}.dot{width:12px;height:12px;border-radius:50%;background:#4e5d79;box-shadow:0 0 14px currentColor}.dot.on{background:var(--green);color:var(--green)}.player .name{font-weight:1000;flex:1}.badge{font-size:11px;font-weight:1000;color:#07101a;background:var(--yellow);padding:5px 8px;border-radius:999px}.wait{color:var(--muted);text-align:center;font-weight:800;padding:10px}.hidden{display:none!important}
.game-wrap{position:relative}.hud{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin-bottom:10px}.scorebox{padding:10px 12px;background:#10192d;border:1px solid #ffffff10;border-radius:15px}.scorebox.right{text-align:right}.score-name{font-size:11px;color:var(--muted);font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.score-num{font-size:22px;font-weight:1000}.round-pill{font-size:12px;font-weight:1000;background:#232e49;padding:8px 10px;border-radius:999px;color:var(--yellow)}.versus-bars{display:grid;gap:6px;margin-bottom:10px}.barrow{display:grid;grid-template-columns:48px 1fr 42px;gap:7px;align-items:center;font-size:10px;font-weight:1000;color:#aab8d3}.bar{height:8px;background:#141c31;border-radius:999px;overflow:hidden;border:1px solid #ffffff0c}.fill{height:100%;width:0%;border-radius:999px;transition:width .15s linear;background:linear-gradient(90deg,var(--cyan),#b7f8ff)}.barrow.rival .fill{background:linear-gradient(90deg,var(--pink),#ffb4d6)}.board-shell{position:relative;border-radius:24px;overflow:hidden;border:1px solid #ffffff16;background:#0a0e18;box-shadow:0 24px 60px #0009}.board-shell:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:24px 24px;opacity:.18}.gamecanvas{display:block;width:100%;height:auto;touch-action:none;position:relative;z-index:1}.tip{font-size:12px;text-align:center;color:#8f9db8;font-weight:800;margin-top:9px}.overlay{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:#060a13aa;backdrop-filter:blur(4px);text-align:center;padding:24px}.count{font-size:86px;font-weight:1000;color:var(--yellow);text-shadow:0 0 35px #ffe36b77;animation:pop .35s ease}.draw{font-size:46px;font-weight:1000;color:var(--cyan);text-shadow:0 0 35px #55e7ff88}.result-title{font-size:34px;font-weight:1000;line-height:1.05}.result-sub{color:var(--muted);font-weight:900;margin-top:8px}.winner{color:var(--yellow);text-shadow:0 0 26px #ffe36b55}.loser{color:#b9c3d8}.bump{position:absolute;z-index:4;left:50%;top:48%;transform:translate(-50%,-50%);font-size:32px;font-weight:1000;color:var(--danger);text-shadow:0 0 22px #ff667a88;pointer-events:none;animation:bump .55s ease both}.final-card{width:100%;max-width:330px;background:#111a2f;border:1px solid #ffffff18;border-radius:24px;padding:20px;box-shadow:0 24px 70px #000c}.final-score{font-size:54px;font-weight:1000;letter-spacing:.08em;margin:10px 0}.small-actions{display:flex;gap:8px;margin-top:12px}.small-actions .btn{flex:1;padding:11px 10px;font-size:13px}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:99;background:#151d31;color:#fff;border:1px solid #ffffff17;border-radius:999px;padding:10px 15px;font-weight:900;font-size:12px;box-shadow:0 12px 30px #000a;max-width:90%;text-align:center}.how{margin-top:14px}.how h3{margin:0 0 8px;font-size:14px}.howgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.howitem{padding:10px 6px;background:#0b1222;border-radius:14px;text-align:center}.howitem b{display:block;font-size:21px;margin-bottom:4px}.howitem span{font-size:10px;color:#96a5c2;font-weight:800;line-height:1.35}@keyframes pop{0%{transform:scale(.65);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}@keyframes bump{0%{transform:translate(-50%,-50%) scale(.6);opacity:0}30%{transform:translate(-50%,-50%) scale(1.15);opacity:1}100%{transform:translate(-50%,-65%) scale(.96);opacity:0}}@media(max-height:720px){.app{padding-top:8px}.brand{padding:8px 0}.logo{font-size:32px}.tag{display:none}.board-shell{max-height:69vh}.gamecanvas{max-height:69vh;object-fit:contain}}
</style>
</head>
<body>
<div class="app">
  <section id="homeScreen">
    <div class="brand"><div class="logo"><span>ROUTE</span> <span>RUSH</span></div><div class="tag">指でなぞれ。先に抜けろ。</div></div>
    <div class="card stack">
      <div><label>PLAYER NAME</label><input id="nameInput" class="field" maxlength="12" placeholder="名前を入力" autocomplete="nickname"></div>
      <div id="createArea">
        <label>ROUNDS</label>
        <div class="seg" style="margin-top:7px"><button id="r3" class="active" type="button">3本勝負</button><button id="r5" type="button">5本勝負</button></div>
        <button id="createBtn" class="btn" style="width:100%;margin-top:12px">部屋をつくる</button>
      </div>
      <div class="divider">OR</div>
      <div class="row"><input id="codeInput" class="field grow" inputmode="numeric" maxlength="4" placeholder="4桁コード"><button id="joinBtn" class="btn pink">参加</button></div>
      <div class="how"><h3>遊び方</h3><div class="howgrid"><div class="howitem"><b>✍️</b><span>道から外れず<br>なぞる</span></div><div class="howitem"><b>💥</b><span>壁に当たると<br>少し戻る</span></div><div class="howitem"><b>🏁</b><span>先にゴールで<br>1ポイント</span></div></div></div>
    </div>
  </section>

  <section id="lobbyScreen" class="hidden">
    <div class="brand"><div class="logo" style="font-size:31px"><span>ROUTE</span> <span>RUSH</span></div><div class="tag">2人そろったら勝負開始！</div></div>
    <div class="card">
      <label style="display:block;text-align:center">ROOM CODE</label>
      <div id="roomCode" class="room-code">0000</div>
      <img id="qrImage" class="qr" alt="参加用QRコード">
      <div class="small-actions"><button id="copyBtn" class="btn dark">参加URLをコピー</button><button id="shareBtn" class="btn dark">共有</button></div>
      <div id="playerList" class="players"></div>
      <button id="startBtn" class="btn" style="width:100%" disabled>2人そろったらスタート</button>
      <div id="guestWait" class="wait hidden">ホストが開始するのを待っています…</div>
    </div>
  </section>

  <section id="gameScreen" class="hidden">
    <div class="hud">
      <div class="scorebox"><div id="myName" class="score-name">YOU</div><div id="myScore" class="score-num">0</div></div>
      <div id="roundPill" class="round-pill">ROUND 1/3</div>
      <div class="scorebox right"><div id="rivalName" class="score-name">RIVAL</div><div id="rivalScore" class="score-num">0</div></div>
    </div>
    <div class="versus-bars">
      <div class="barrow"><span>YOU</span><div class="bar"><div id="myFill" class="fill"></div></div><span id="myPct">0%</span></div>
      <div class="barrow rival"><span>RIVAL</span><div class="bar"><div id="rivalFill" class="fill"></div></div><span id="rivalPct">0%</span></div>
    </div>
    <div id="boardShell" class="board-shell">
      <canvas id="gameCanvas" class="gamecanvas" width="360" height="560"></canvas>
      <div id="gameOverlay" class="overlay hidden"></div>
    </div>
    <div class="tip">キャラを押したまま、白い道の上をゴールまでなぞろう</div>
  </section>
</div>
<div id="toast" class="toast hidden"></div>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const home = $('#homeScreen'), lobby = $('#lobbyScreen'), game = $('#gameScreen');
  const canvas = $('#gameCanvas'), ctx = canvas.getContext('2d');
  const W=360,H=560;
  const state = {room:null, playerId:null, playerToken:null, hostToken:'', isHost:false, joinUrl:'', ws:null, rounds:3, server:null, maze:null, drawing:false, frozenUntil:0, pos:null, checkpoint:null, trail:[], finished:false, stage:'home', lastSent:0};

  function show(screen){ home.classList.toggle('hidden',screen!=='home'); lobby.classList.toggle('hidden',screen!=='lobby'); game.classList.toggle('hidden',screen!=='game'); }
  function toast(msg){ const el=$('#toast'); el.textContent=msg; el.classList.remove('hidden'); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.add('hidden'),2200); }
  function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  async function api(url,opt={}){ const r=await fetch(url,{headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt}); let body={}; try{body=await r.json()}catch{} if(!r.ok) throw new Error(body.detail||'エラーが発生しました'); return body; }

  $('#r3').onclick=()=>{state.rounds=3;$('#r3').classList.add('active');$('#r5').classList.remove('active')};
  $('#r5').onclick=()=>{state.rounds=5;$('#r5').classList.add('active');$('#r3').classList.remove('active')};
  $('#codeInput').addEventListener('input',e=>e.target.value=e.target.value.replace(/\D/g,'').slice(0,4));

  $('#createBtn').onclick=async()=>{
    const name=$('#nameInput').value.trim(); if(!name){toast('名前を入れてね');return}
    try{
      const d=await api('/api/rooms',{method:'POST',body:JSON.stringify({name,rounds:state.rounds})});
      state.room=d.code; state.playerId=d.player_id; state.playerToken=d.player_token; state.hostToken=d.host_token; state.isHost=true; state.joinUrl=d.join_url;
      history.replaceState(null,'',`/host/${d.code}#host=${encodeURIComponent(d.host_token)}&player=${encodeURIComponent(d.player_token)}`);
      openLobby(); connectWS();
    }catch(e){toast(e.message)}
  };

  $('#joinBtn').onclick=()=>joinFromForm($('#codeInput').value.trim());
  async function joinFromForm(code){
    const name=$('#nameInput').value.trim(); if(!name){toast('名前を入れてね');return} if(!/^\d{4}$/.test(code)){toast('4桁のルームコードを入れてね');return}
    try{
      const d=await api(`/api/rooms/${code}/join`,{method:'POST',body:JSON.stringify({name})});
      state.room=code; state.playerId=d.player_id; state.playerToken=d.player_token; state.isHost=false; state.joinUrl=`${location.origin}/join/${code}`;
      history.replaceState(null,'',`/join/${code}#player=${encodeURIComponent(d.player_token)}&id=${encodeURIComponent(d.player_id)}`);
      openLobby(); connectWS();
    }catch(e){toast(e.message)}
  }

  function openLobby(){ show('lobby'); $('#roomCode').textContent=state.room; state.joinUrl=state.joinUrl||`${location.origin}/join/${state.room}`; $('#qrImage').src=`/qr?url=${encodeURIComponent(state.joinUrl)}`; $('#startBtn').classList.toggle('hidden',!state.isHost); $('#guestWait').classList.toggle('hidden',state.isHost); }
  $('#copyBtn').onclick=async()=>{try{await navigator.clipboard.writeText(state.joinUrl);toast('参加URLをコピーしたよ')}catch{toast('コピーできませんでした')}};
  $('#shareBtn').onclick=async()=>{if(navigator.share){try{await navigator.share({title:'ROUTE RUSH',text:`ルーム ${state.room} で対戦しよう！`,url:state.joinUrl})}catch{}}else{$('#copyBtn').click()}};
  $('#startBtn').onclick=async()=>{try{await api(`/api/rooms/${state.room}/start`,{method:'POST',headers:{'x-host-token':state.hostToken},body:'{}'})}catch(e){toast(e.message)}};

  function connectWS(){
    if(!state.room||!state.playerId||!state.playerToken) return;
    if(state.ws && state.ws.readyState<=1) state.ws.close();
    const proto=location.protocol==='https:'?'wss':'ws';
    const q=new URLSearchParams({player:state.playerId,token:state.playerToken}); if(state.hostToken)q.set('host',state.hostToken);
    const ws=new WebSocket(`${proto}://${location.host}/ws/${state.room}?${q}`); state.ws=ws;
    ws.onmessage=e=>{try{renderServer(JSON.parse(e.data))}catch(err){console.error(err)}};
    ws.onclose=()=>{ if(state.room) setTimeout(()=>{if(state.ws===ws)connectWS()},1200); };
  }

  function renderServer(s){
    state.server=s; state.playerId=s.player_id||state.playerId; state.isHost=!!s.is_host;
    if(s.stage==='lobby'){
      state.stage='lobby'; show('lobby'); openLobby();
      $('#playerList').innerHTML=s.players.map(p=>`<div class="player"><span class="dot ${p.connected?'on':''}"></span><span class="name">${esc(p.name)}</span>${p.id===s.host_player_id?'<span class="badge">HOST</span>':''}</div>`).join('') + (s.players.length<2?'<div class="player" style="opacity:.45"><span class="dot"></span><span class="name">参加者を待っています…</span></div>':'');
      if(state.isHost){ const ready=s.players.length===2; $('#startBtn').disabled=!ready; $('#startBtn').textContent=ready?'ゲームスタート！':'2人そろったらスタート'; }
      return;
    }

    show('game'); state.stage=s.stage; updateHud(s);
    if((s.stage==='countdown'||s.stage==='playing') && (!state.maze || state.maze.seed!==s.seed)) resetRound(s.seed,s.round_no);

    if(s.stage==='countdown') showCountdown(s.countdown_ms);
    else if(s.stage==='playing'){ $('#gameOverlay').classList.add('hidden'); state.finished=false; drawBoard(); }
    else if(s.stage==='round_result') showRoundResult(s);
    else if(s.stage==='final_result') showFinal(s);
  }

  function updateHud(s){
    const me=s.players.find(p=>p.id===state.playerId)||s.players[0]||{}; const rival=s.players.find(p=>p.id!==state.playerId)||{};
    $('#myName').textContent=me.name||'YOU'; $('#rivalName').textContent=rival.name||'RIVAL'; $('#myScore').textContent=me.score||0; $('#rivalScore').textContent=rival.score||0;
    $('#roundPill').textContent=`ROUND ${Math.max(1,s.round_no)}/${s.rounds_total}`;
    const mp=Math.round(me.progress||0), rp=Math.round(rival.progress||0); $('#myFill').style.width=mp+'%'; $('#rivalFill').style.width=rp+'%'; $('#myPct').textContent=mp+'%'; $('#rivalPct').textContent=rp+'%';
  }

  function showCountdown(ms){
    const ov=$('#gameOverlay'); ov.classList.remove('hidden');
    const n=Math.max(1,Math.ceil(ms/1000)); ov.innerHTML=`<div class="count">${n}</div>`;
  }

  function showRoundResult(s){
    const ov=$('#gameOverlay'); ov.classList.remove('hidden'); const win=s.winner_id===state.playerId; const winner=s.players.find(p=>p.id===s.winner_id);
    ov.innerHTML=`<div><div class="result-title ${win?'winner':'loser'}">${win?'YOU WIN!':'RIVAL WIN!'}</div><div class="result-sub">${esc(winner?.name||'')} が先にゴール！<br>次のラウンドへ…</div></div>`;
  }

  function showFinal(s){
    const ov=$('#gameOverlay'); ov.classList.remove('hidden'); const me=s.players.find(p=>p.id===state.playerId)||{}; const rival=s.players.find(p=>p.id!==state.playerId)||{}; const won=(me.score||0)>(rival.score||0);
    ov.innerHTML=`<div class="final-card"><div class="result-title ${won?'winner':'loser'}">${won?'🏆 WINNER!':'GOOD GAME!'}</div><div class="final-score">${me.score||0} - ${rival.score||0}</div><div class="result-sub">${won?'ナイスルート！':'次は取り返そう！'}</div>${state.isHost?'<button id="rematchBtn" class="btn" style="width:100%;margin-top:16px">もう一回！</button>':'<div class="wait">ホストの再戦を待っています…</div>'}</div>`;
    if(state.isHost){setTimeout(()=>{const b=$('#rematchBtn');if(b)b.onclick=async()=>{try{await api(`/api/rooms/${state.room}/rematch`,{method:'POST',headers:{'x-host-token':state.hostToken},body:'{}'})}catch(e){toast(e.message)}}},0)}
  }

  function mulberry32(a){return function(){let t=a+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
  function makeMaze(seed,roundNo){
    const rnd=mulberry32((seed>>>0)+(roundNo*7919)); const cols=roundNo>=4?6:5; const rows=Math.min(11,7+roundNo); const mx=34,my=42; const dx=(W-mx*2)/(cols-1), dy=(H-my*2)/(rows-1);
    const nodes=[]; for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)nodes.push({r,c,x:mx+c*dx,y:my+r*dy});
    const idx=(r,c)=>r*cols+c, visited=new Set(), edges=[]; const start={r:rows-1,c:Math.floor((cols-1)/2)}; const stack=[start]; visited.add(idx(start.r,start.c));
    const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
    while(stack.length){ const cur=stack[stack.length-1]; const opts=dirs.map(([dr,dc])=>({r:cur.r+dr,c:cur.c+dc})).filter(n=>n.r>=0&&n.r<rows&&n.c>=0&&n.c<cols&&!visited.has(idx(n.r,n.c))); if(!opts.length){stack.pop();continue} const next=opts[Math.floor(rnd()*opts.length)]; visited.add(idx(next.r,next.c)); edges.push([idx(cur.r,cur.c),idx(next.r,next.c)]); stack.push(next); }
    const goal={r:0,c:Math.floor(cols/2)}; const segs=edges.map(([a,b])=>[nodes[a],nodes[b]]);
    return {seed,cols,rows,nodes,segs,start:nodes[idx(start.r,start.c)],goal:nodes[idx(goal.r,goal.c)],roadWidth:roundNo>=4?22:26};
  }

  function resetRound(seed,roundNo){ state.maze=makeMaze(seed,roundNo); state.pos={x:state.maze.start.x,y:state.maze.start.y}; state.checkpoint={...state.pos}; state.trail=[{...state.pos}]; state.drawing=false; state.frozenUntil=0; state.finished=false; drawBoard(); }
  function dps(x,y,a,b){ const vx=b.x-a.x,vy=b.y-a.y,wx=x-a.x,wy=y-a.y; const c1=vx*wx+vy*wy,c2=vx*vx+vy*vy; let t=c2?c1/c2:0;t=Math.max(0,Math.min(1,t)); const px=a.x+t*vx,py=a.y+t*vy; return Math.hypot(x-px,y-py); }
  function onRoad(x,y){ if(!state.maze)return false; if(Math.hypot(x-state.maze.start.x,y-state.maze.start.y)<state.maze.roadWidth*.72)return true; if(Math.hypot(x-state.maze.goal.x,y-state.maze.goal.y)<state.maze.roadWidth*.8)return true; return state.maze.segs.some(([a,b])=>dps(x,y,a,b)<=state.maze.roadWidth*.48); }
  function nearestNode(x,y){ let best=null,bd=1e9; for(const n of state.maze.nodes){const d=Math.hypot(x-n.x,y-n.y);if(d<bd){bd=d;best=n}} return bd<17?best:null; }
  function logicalPoint(e){ const r=canvas.getBoundingClientRect(); return {x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}; }
  function canPlay(){return state.server?.stage==='playing'&&!state.finished&&Date.now()>=state.frozenUntil}

  canvas.addEventListener('pointerdown',e=>{ if(!canPlay()||!state.pos)return; const p=logicalPoint(e); if(Math.hypot(p.x-state.pos.x,p.y-state.pos.y)>28)return; state.drawing=true; canvas.setPointerCapture?.(e.pointerId); e.preventDefault(); });
  canvas.addEventListener('pointermove',e=>{ if(!state.drawing||!canPlay())return; e.preventDefault(); const target=logicalPoint(e), from=state.pos; const dist=Math.hypot(target.x-from.x,target.y-from.y), steps=Math.max(1,Math.ceil(dist/4)); let bad=false,last=from;
    for(let i=1;i<=steps;i++){ const p={x:from.x+(target.x-from.x)*i/steps,y:from.y+(target.y-from.y)*i/steps}; if(!onRoad(p.x,p.y)){bad=true;break} last=p; }
    if(bad){ bump(); return; }
    state.pos={x:last.x,y:last.y}; state.trail.push({...state.pos}); if(state.trail.length>500)state.trail.shift(); const n=nearestNode(state.pos.x,state.pos.y); if(n && n.y<state.checkpoint.y-3)state.checkpoint={x:n.x,y:n.y};
    const prog=Math.max(0,Math.min(99.5,(state.maze.start.y-state.pos.y)/(state.maze.start.y-state.maze.goal.y)*100)); sendProgress(prog); drawBoard();
    if(Math.hypot(state.pos.x-state.maze.goal.x,state.pos.y-state.maze.goal.y)<17){finish()}
  });
  canvas.addEventListener('pointerup',e=>{state.drawing=false;e.preventDefault()}); canvas.addEventListener('pointercancel',()=>state.drawing=false);

  function bump(){ state.drawing=false; state.frozenUntil=Date.now()+700; state.pos={...state.checkpoint}; state.trail.push({...state.pos}); const shell=$('#boardShell'), el=document.createElement('div'); el.className='bump'; el.textContent='BUMP!'; shell.appendChild(el); setTimeout(()=>el.remove(),600); if(navigator.vibrate)navigator.vibrate(45); const prog=Math.max(0,(state.maze.start.y-state.pos.y)/(state.maze.start.y-state.maze.goal.y)*100); sendProgress(prog,true); drawBoard(); }
  function sendProgress(v,force=false){ const now=Date.now(); if(!force&&now-state.lastSent<90)return; state.lastSent=now; if(state.ws?.readyState===1)state.ws.send(JSON.stringify({type:'progress',value:v})); }
  function finish(){ if(state.finished)return; state.finished=true; state.drawing=false; if(state.ws?.readyState===1)state.ws.send(JSON.stringify({type:'finish'})); if(navigator.vibrate)navigator.vibrate([70,40,100]); }

  function drawBoard(){
    ctx.clearRect(0,0,W,H); if(!state.maze)return;
    const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#101a2d');g.addColorStop(1,'#070b13');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    for(let y=14;y<H;y+=24){ctx.fillStyle='rgba(255,255,255,.025)';ctx.fillRect(0,y,W,1)}
    const m=state.maze; ctx.lineCap='round';ctx.lineJoin='round';
    ctx.strokeStyle='rgba(0,0,0,.65)';ctx.lineWidth=m.roadWidth+10;ctx.beginPath(); for(const [a,b] of m.segs){ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y)}ctx.stroke();
    ctx.strokeStyle='#e9f2ff';ctx.lineWidth=m.roadWidth;ctx.beginPath(); for(const [a,b] of m.segs){ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y)}ctx.stroke();
    ctx.strokeStyle='rgba(85,231,255,.18)';ctx.lineWidth=Math.max(2,m.roadWidth-8);ctx.beginPath();for(const [a,b] of m.segs){ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y)}ctx.stroke();
    ctx.fillStyle='#ffd85f';ctx.beginPath();ctx.arc(m.goal.x,m.goal.y,20,0,Math.PI*2);ctx.fill();ctx.fillStyle='#1b2130';ctx.font='900 20px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('★',m.goal.x,m.goal.y+1);
    ctx.fillStyle='#55e7ff';ctx.beginPath();ctx.arc(m.start.x,m.start.y,18,0,Math.PI*2);ctx.fill();ctx.fillStyle='#07111a';ctx.font='900 10px system-ui';ctx.fillText('START',m.start.x,m.start.y+1);
    if(state.trail.length>1){ctx.strokeStyle='#55e7ff';ctx.shadowColor='#55e7ff';ctx.shadowBlur=12;ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(state.trail[0].x,state.trail[0].y);for(let i=1;i<state.trail.length;i++)ctx.lineTo(state.trail[i].x,state.trail[i].y);ctx.stroke();ctx.shadowBlur=0}
    if(state.pos){const p=state.pos;ctx.fillStyle='#ff5fa2';ctx.shadowColor='#ff5fa2';ctx.shadowBlur=15;ctx.beginPath();ctx.arc(p.x,p.y,12,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(p.x-4,p.y-2,2.2,0,Math.PI*2);ctx.arc(p.x+4,p.y-2,2.2,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(p.x,p.y+2,5,0.15,Math.PI-.15);ctx.stroke();}
  }

  function restoreFromUrl(){
    const m=location.pathname.match(/^\/(host|join)\/(\d{4})/); if(!m)return;
    const code=m[2], hash=new URLSearchParams(location.hash.slice(1)), token=hash.get('player'), id=hash.get('id'), hostToken=hash.get('host');
    if(token && (id||hostToken)){
      state.room=code;state.playerToken=token;state.playerId=id||null;state.hostToken=hostToken||'';state.isHost=!!hostToken;state.joinUrl=`${location.origin}/join/${code}`;
      if(!state.playerId && state.isHost){ toast('再読み込み後は部屋を作り直してね'); history.replaceState(null,'','/'); return; }
      openLobby();connectWS();return;
    }
    if(m[1]==='join'){ $('#codeInput').value=code; $('#createArea').classList.add('hidden'); $('#codeInput').readOnly=true; $('#joinBtn').textContent='この部屋に参加'; }
  }

  restoreFromUrl(); drawBoard();
})();
</script>
</body>
